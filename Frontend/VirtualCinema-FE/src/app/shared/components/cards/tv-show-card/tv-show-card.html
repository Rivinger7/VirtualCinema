<div class="flex flex-col gap-y-2 w-full cursor-pointer p-2">
  <div class="group relative overflow-hidden rounded-xl">
    <img
      class="aspect-2/3 w-full object-cover transition-all duration-300 group-hover:scale-105 group-hover:brightness-50"
      [title]="tvShow().name"
      [src]="'https://image.tmdb.org/t/p/w500' + tvShow().poster_path"
      [alt]="tvShow().name"
    />
    <div
      class="absolute inset-x-0 bottom-0 h-24 bg-linear-to-t from-black via-black/60 to-transparent"
    ></div>
  </div>
  <div class="flex flex-col">
    <h3 class="text-lg font-bold text-zinc-300 line-clamp-1 hover:underline">
      {{ tvShow().name }}
    </h3>
    <div class="flex flex-row items-center gap-x-4">
      <p-rating class="custom-rating size-2" [stars]="1" [ngModel]="1" [readonly]="true"></p-rating>
      <span class="text-zinc-300 text-sm">
        {{ ((tvShow().vote_average * 5) / 10).toFixed(1) }}
      </span>
    </div>
  </div>
</div>
