<div class="absolute mt-6">
  <div
    class="absolute -top-1.5 left-8 h-3 w-3 rotate-45 bg-slate-900 border-l border-t border-zinc-700"
  ></div>
  <div class="min-w-175 rounded-xl border border-zinc-700 bg-slate-900 shadow-2xl p-6">
    <div class="grid grid-cols-4 gap-x-8 gap-y-4">
      @for (genre of genres(); track genre.id) {
        <a
          class="text-gray-300 text-sm hover:text-white hover:cursor-pointer transition-colors relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 hover:after:w-full select-none"
          (click)="selectGenre(genre.name)"
        >
          {{ genre.name }}
        </a>
      }
    </div>
  </div>
</div>
