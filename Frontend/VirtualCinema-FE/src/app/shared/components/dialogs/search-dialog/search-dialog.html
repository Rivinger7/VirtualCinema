<mat-dialog-content class="rounded-2xl">
  <div class="flex items-center rounded-xl border border-zinc-700 px-4 py-3">
    <lucide-icon [img]="searchIcon" class="text-zinc-500 outline-none"></lucide-icon>
    <input
      matInput
      placeholder="Search or ask anything"
      class="ml-3 w-full bg-transparent outline-none text-zinc-500"
    />
    <span class="rounded border border-zinc-600 px-2 py-0.5 text-xs text-zinc-400"> Esc </span>
  </div>
  <div class="px-4 pt-2 text-sm text-zinc-500">Suggestions</div>
  <p-scrollPanel
    class="max-h-100 overflow-y-auto py-2 text-zinc-500"
    [style]="{ width: '100%', height: '330px' }"
  >
    @for (movie of popularMovies()?.results; track movie) {
      <div
        class="flex cursor-pointer items-center gap-3 px-4 py-2 hover:bg-zinc-800 transition-all duration-200"
      >
        <img
          [src]="'https://image.tmdb.org/t/p/w92' + movie.poster_path"
          [alt]="movie.title"
          class="w-8 h-auto rounded object-cover"
        />
        <span>{{ movie.title }}</span>
      </div>
    }
  </p-scrollPanel>
</mat-dialog-content>
