@if (isLoading()) {
  <div class="min-h-screen bg-slate-950 px-4 py-6 md:px-10 md:py-8">
    <div class="mb-8 overflow-hidden rounded-3xl border border-slate-800 bg-slate-900/70 p-4">
      <p-skeleton height="24rem" class="w-full" />
    </div>

    <div class="mb-8 flex flex-col gap-4">
      <p-skeleton height="2rem" width="12rem" />
      <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
        @for (_ of [1, 2, 3]; track $index) {
          <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <p-skeleton height="10rem" class="mb-3 w-full" />
            <p-skeleton height="1rem" class="mb-2 w-3/4" />
            <p-skeleton height="1rem" width="2/3" />
          </div>
        }
      </div>
    </div>

    <div class="space-y-4">
      <p-skeleton height="2rem" width="10rem" />
      <div class="grid grid-cols-1 gap-4 md:grid-cols-4">
        @for (_ of [1, 2, 3, 4]; track $index) {
          <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4">
            <p-skeleton height="14rem" class="w-full" />
          </div>
        }
      </div>
    </div>
  </div>
} @else {
  <div class="min-h-screen bg-slate-950">
    <app-banner-section />

    <div class="flex flex-col gap-y-12">
      <app-popular-section />
      <app-now-playing-section />
      <div class="relative h-[50vh]">
        <img
          class="absolute inset-0 w-full h-full object-cover object-[50%_30%]"
          src="../../assets/landpage/6964c788c3464b61e081d6d4_golden-globes-2026.webp"
          alt="Golden Globes 2026"
        />
        <div class="absolute inset-0">
          <div
            class="absolute top-0 left-0 right-0 h-12 bg-linear-to-b from-slate-950 via-slate-950/60 to-transparent"
          ></div>
          <div
            class="absolute bottom-0 left-0 right-0 h-20 bg-linear-to-t from-slate-950 via-slate-950/6 to-transparent"
          ></div>
          <div
            class="absolute left-0 top-0 bottom-0 w-12 bg-linear-to-r from-slate-950/60 to-transparent"
          ></div>
          <div
            class="absolute right-0 top-0 bottom-0 w-12 bg-linear-to-l from-slate-950/60 to-transparent"
          ></div>
        </div>
      </div>
      <app-top-rated-section />
      <app-up-coming-section />
    </div>
  </div>
}
