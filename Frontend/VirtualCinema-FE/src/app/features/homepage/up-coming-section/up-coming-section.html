<section class="px-4">
  <div class="flex flex-col gap-y-2">
    <h2 class="ml-4 text-2xl font-semibold text-orange-400">Up Coming</h2>
    <p-carousel
      class="movie-carousel"
      [value]="upComingMovies()"
      [numVisible]="7"
      [numScroll]="3"
      [circular]="true"
      [autoplayInterval]="6000"
    >
      <ng-template let-movie pTemplate="item">
        <app-movie-card
          [movie]="movie"
          (click)="selectMovie(movie.id, movie.title)"
        ></app-movie-card>
      </ng-template>
    </p-carousel>
  </div>
</section>
