<div class="min-h-screen bg-slate-950">
  <div class="px-10 pt-50 pb-10 space-y-6">
    <div class="flex justify-center">
      <p-paginator
        class="bg-slate-950!"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="Math.min((movies()?.total_pages ?? 0) * rows, 500 * rows)"
      />
    </div>
    <div class="grid grid-cols-5 gap-4">
      @for (movie of movies()?.results; track movie.id) {
        <app-movie-card [movie]="movie" />
      }
    </div>
    <div class="flex justify-center">
      <p-paginator
        class="bg-slate-950!"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="Math.min((movies()?.total_pages ?? 0) * rows, 500 * rows)"
      />
    </div>
  </div>
</div>
