<header class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[90%]">
  <nav class="px-4 py-2 bg-slate-900/20 backdrop-blur-lg border border-cyan-500/20 rounded-2xl">
    <div class="flex flex-1 flex-row items-center gap-x-2 font-medium w-full">
      <a href="">
        <img
          class="w-20 h-15 object-contain"
          src="/assets/logo/logo.png"
          alt="VirtualCinema Logo"
        />
      </a>
      <div>
        <a
          class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200 relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 hover:after:w-full hover:cursor-pointer"
          routerLink="/"
          >Home</a
        >
      </div>
      <div class="relative group">
        <a
          class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200 relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 group-hover:after:w-full hover:cursor-pointer"
          >Movies</a
        >
        <div class="absolute top-full left-0 h-8 w-full"></div>
        @if (moviveGenres()) {
          <app-mega-menu-category
            class="hidden group-hover:block"
            [routerCategoryName]="'movie'"
            [genres]="moviveGenres()"
          />
        }
      </div>
      <div class="relative group">
        <a
          class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200 relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 group-hover:after:w-full hover:cursor-pointer"
          >TV Shows</a
        >
        <div class="absolute top-full left-0 h-8 w-full"></div>
        @if (tvShowGenres()) {
          <app-mega-menu-category
            class="hidden group-hover:block"
            [routerCategoryName]="'tv-show'"
            [genres]="tvShowGenres()"
          />
        }
      </div>
      <div>
        <a
          class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200 relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 hover:after:w-full hover:cursor-pointer"
          routerLink=""
          >Recently Added</a
        >
      </div>
      <div>
        <a
          class="px-4 py-2 text-gray-300 hover:text-white transition-all duration-200 relative after:absolute after:left-0 after:-bottom-1 after:h-0.5 after:w-0 after:bg-indigo-400 after:transition-all after:duration-300 hover:after:w-full hover:cursor-pointer"
          routerLink=""
          >My List</a
        >
      </div>
      <!-- <app-mega-menu-category [menuCategories]="menuCategories" /> -->
      <div class="flex flex-1 justify-end gap-x-6">
        <button
          class="flex flex-row items-center justify-start text-gray-300 hover:cursor-pointer hover:text-yellow-400 transition-all duration-300"
          (click)="openSearchDialog()"
        >
          <lucide-icon [img]="searchIcon"></lucide-icon>
        </button>
        <div class="flex flex-row justify-end gap-x-2">
          <button
            type="button"
            class="border-2 border-amber-500 text-white px-4 py-1 rounded transition-all duration-200 hover:cursor-pointer hover:bg-amber-500 hover:text-black"
            (click)="openLoginDialog()"
          >
            Login
          </button>
          <button
            type="button"
            class="bg-yellow-400 text-black px-4 py-1 rounded transition-all duration-200 hover:cursor-pointer hover:bg-yellow-300"
          >
            Register
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
